<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Zalo Nodes cho n8n</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Tài liệu Zalo Nodes cho n8n">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: linear-gradient(135deg, #F1EFEC, #123458, #030303);
      --secondary-color: #1A1A1A;
      --accent-color: #00C6FF;
      --text-color: #333333;
      --light-gray: #F5F7FA;
      --border-color: #E4E7ED;
      --shadow-color: rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #fff !important;
      color: var(--text-color);
      line-height: 1.6;
    }

    /* Sidebar Styling */
    .sidebar {
      background: var(--light-gray) !important;
      border-right: 1px solid var(--border-color);
      padding: 2rem 0;
    }

    .sidebar-nav {
      padding: 0 1rem;
    }

    .sidebar-nav li {
      margin: 0.5rem 0;
    }

    .sidebar-nav a {
      color: var(--text-color);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    .sidebar ul li.active>a {
      background: var(--primary-color);
      border: unset;
      color: white;
    }

    .sidebar-nav a:hover {
      background: var(--primary-color);
      color: white;
    }

    .app-sub-sidebar li:before {
      content: "";
      padding-right: 4px;
      float: left;
    }

    /* Content Styling */
    .content {
      background: #fff !important;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .markdown-section {
      max-width: 800px;
      margin: 0 auto;
    }

    .markdown-section h1 {
      color: var(--primary-color);
      font-size: 2.5rem;
      margin-bottom: 2rem;
      font-weight: 700;
    }

    .markdown-section h2 {
      color: var(--secondary-color);
      font-size: 2rem;
      margin: 2rem 0 1rem;
      font-weight: 600;
    }

    .markdown-section h3 {
      color: var(--secondary-color);
      font-size: 1.5rem;
      margin: 1.5rem 0 1rem;
      font-weight: 600;
    }

    .markdown-section p {
      margin-bottom: 1rem;
    }

    /* Code Block Styling */
    pre {
      background: var(--light-gray);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 2px 4px var(--shadow-color);
    }

    code {
      font-family: 'Fira Code', monospace;
      background: var(--light-gray);
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
    }

    /* Search Bar Styling */
    .search {
      background: #fff !important;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 4px var(--shadow-color);
    }

    .search input {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 0.5rem 1rem;
    }

    .search {
      display: none;
    }

    input[type="search"] {
      display: none;
    }
    /* Responsive Design */
    @media (max-width: 768px) {
      .content {
        padding: 1rem;
      }

      .markdown-section h1 {
        font-size: 2rem;
      }

      .markdown-section h2 {
        font-size: 1.75rem;
      }

      .markdown-section h3 {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'N8N-NODES-ZALO-TOOLS',
      repo: 'https://github.com/taducquang/zalo-node',
      loadSidebar: 'sidebar.md',
      subMaxLevel: 2,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Tim kiem...',
        noData: 'Khong tim thay ket qua!',
        depth: 6
      },
      themeColor: '#0068FF',
      auto2top: true,
      coverpage: false,
      loadNavbar: false,
      mergeNavbar: true,
      formatUpdated: '{YYYY}-{MM}-{DD} {HH}:{mm}',
      plugins: [
        function(hook, vm) {
          hook.beforeEach(function(content) {
            return content;
          });
        }
      ]
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
</body>
</html>
