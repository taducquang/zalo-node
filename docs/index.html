<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>n8n-nodes-zalo-node</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="n8n-nodes-zalo-node - Documentation">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a1a1a;
      --bg-secondary: #232323;
      --surface: #2a2a2a;
      --surface-hover: #333333;
      --primary: #d4a27a;
      --primary-hover: #c48e62;
      --primary-subtle: rgba(212, 162, 122, 0.12);
      --text: #e8e4e0;
      --text-secondary: #9a9590;
      --text-muted: #6b6560;
      --border: #3a3735;
      --border-subtle: #2e2c2a;
      --code-bg: #252220;
      --sidebar-bg: #1e1e1e;
      --sidebar-hover: #2a2826;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
      --radius: 10px;
      --radius-sm: 6px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg) !important;
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ─── Sidebar ─── */
    .sidebar {
      background: var(--sidebar-bg) !important;
      border-right: 1px solid var(--border-subtle);
      padding: 1.5rem 0;
    }

    .sidebar-nav {
      padding: 0 0.75rem;
    }

    .sidebar-nav li {
      margin: 2px 0;
    }

    .sidebar-nav a {
      color: var(--text-secondary);
      padding: 0.5rem 0.85rem;
      border-radius: var(--radius-sm);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      font-size: 0.9rem;
      font-weight: 500;
      display: block;
      text-decoration: none;
      position: relative;
      overflow: hidden;
    }

    .sidebar-nav a::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%) scaleY(0);
      width: 3px;
      height: 60%;
      background: var(--primary);
      border-radius: 0 2px 2px 0;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar-nav a:hover {
      background: var(--sidebar-hover);
      color: var(--text);
      padding-left: 1.1rem;
    }

    .sidebar-nav a:hover::before {
      transform: translateY(-50%) scaleY(1);
    }

    .sidebar ul li.active > a {
      background: var(--primary-subtle);
      border: none;
      color: var(--primary);
      font-weight: 600;
      padding-left: 1.1rem;
    }

    .sidebar ul li.active > a::before {
      transform: translateY(-50%) scaleY(1);
    }

    .sidebar ul li.active > a:hover {
      background: rgba(212, 162, 122, 0.18);
      color: var(--primary);
    }

    .app-sub-sidebar li:before {
      content: "";
      padding-right: 4px;
      float: left;
    }

    .app-name-link {
      font-weight: 800 !important;
      font-size: 1rem !important;
      color: var(--text) !important;
      letter-spacing: -0.02em;
      padding: 0.5rem 0.85rem !important;
    }

    /* Section labels in sidebar */
    .sidebar-nav > ul > li > p {
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 1rem 0.85rem 0.25rem;
      margin: 0;
    }

    /* ─── Content ─── */
    .content {
      background: var(--bg) !important;
      padding: 2.5rem 3rem;
    }

    .markdown-section {
      max-width: 780px;
      margin: 0 auto;
    }

    /* h1 — Page title */
    .markdown-section h1 {
      color: var(--text);
      font-size: 2.5rem;
      margin-bottom: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.15;
    }

    /* h2 — Section header — large with border */
    .markdown-section h2 {
      color: var(--text);
      font-size: 1.7rem;
      margin: 3rem 0 1.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--border);
      line-height: 1.3;
    }

    /* h3 — Subsection — clearly smaller, no border, muted accent */
    .markdown-section h3 {
      color: var(--primary);
      font-size: 1.1rem;
      margin: 2rem 0 0.6rem;
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1.4;
    }

    .markdown-section p {
      margin-bottom: 1rem;
      color: var(--text);
    }

    .markdown-section a {
      color: var(--primary);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s, color 0.2s;
    }

    .markdown-section a:hover {
      border-bottom-color: var(--primary);
      color: var(--primary-hover);
    }

    .markdown-section strong {
      font-weight: 600;
      color: var(--text);
    }

    .markdown-section blockquote {
      border-left: 3px solid var(--primary);
      padding: 0.75rem 1.25rem;
      margin: 1.5rem 0;
      background: var(--surface);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      color: var(--text-secondary);
    }

    .markdown-section blockquote p {
      color: var(--text-secondary);
    }

    /* ─── Tables ─── */
    .markdown-section table {
      border-collapse: collapse;
      width: 100%;
      margin: 1.5rem 0;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .markdown-section table th {
      background: var(--surface);
      font-weight: 600;
      text-align: left;
      padding: 0.75rem 1rem;
      border-bottom: 2px solid var(--border);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .markdown-section table td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text);
    }

    .markdown-section table tr:last-child td {
      border-bottom: none;
    }

    .markdown-section table tr:hover td {
      background: var(--surface);
    }

    /* ─── Code ─── */
    pre {
      background: var(--code-bg) !important;
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      border: 1px solid var(--border);
      margin: 1.5rem 0;
    }

    code {
      font-family: 'Fira Code', 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
      font-size: 0.875rem;
      color: var(--text);
    }

    :not(pre) > code {
      background: var(--surface);
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      color: var(--primary);
      font-size: 0.85em;
      border: 1px solid var(--border-subtle);
    }

    /* ─── Search ─── */
    .search {
      margin-bottom: 1rem;
    }

    .search .input-wrap {
      background: var(--surface) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius-sm) !important;
    }

    .search input[type="search"] {
      background: transparent !important;
      color: var(--text) !important;
      font-family: 'Inter', sans-serif !important;
    }

    .search input::placeholder {
      color: var(--text-muted) !important;
    }

    .search .matching-post {
      background: var(--surface) !important;
      border-bottom: 1px solid var(--border-subtle) !important;
    }

    .search .matching-post:hover {
      background: var(--surface-hover) !important;
    }

    /* ─── Lists ─── */
    .markdown-section ul,
    .markdown-section ol {
      padding-left: 1.5rem;
    }

    .markdown-section li {
      margin: 0.4rem 0;
      color: var(--text);
    }

    .markdown-section li::marker {
      color: var(--text-muted);
    }

    /* ─── Horizontal rule ─── */
    .markdown-section hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* ─── Responsive ─── */
    @media (max-width: 768px) {
      .content {
        padding: 1.5rem 1rem;
      }

      .markdown-section h1 {
        font-size: 1.85rem;
      }

      .markdown-section h2 {
        font-size: 1.4rem;
      }

      .markdown-section h3 {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'n8n-nodes-zalo-node',
      repo: 'https://github.com/taducquang/zalo-node',
      loadSidebar: 'sidebar.md',
      subMaxLevel: 2,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Tìm kiếm...',
        noData: 'Không tìm thấy kết quả!',
        depth: 6
      },
      themeColor: '#d4a27a',
      auto2top: true,
      coverpage: false,
      loadNavbar: false,
      mergeNavbar: true,
      formatUpdated: '{YYYY}-{MM}-{DD} {HH}:{mm}',
      plugins: [
        function(hook, vm) {
          hook.beforeEach(function(content) {
            return content;
          });
        }
      ]
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
</body>
</html>
